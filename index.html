<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tyree's Travel Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:#111118;color:#e8e8ec;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,6vw,3.5rem);font-weight:900;margin-bottom:0.5rem;text-align:center}
.sub{color:#888;font-size:0.95rem;margin-bottom:3rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem;max-width:900px;width:100%}
.card{background:#1a1a24;border:1px solid #2a2a35;border-radius:1rem;padding:2rem;text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.card:nth-child(1)::before{background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
.card:nth-child(2)::before{background:linear-gradient(90deg,#10b981,#6ee7b7)}
.card:nth-child(3)::before{background:linear-gradient(90deg,#f59e0b,#fcd34d)}
.card h2{font-size:1.2rem;margin-bottom:0.5rem}
.card p{font-size:0.85rem;color:#999;line-height:1.6}
.card .dates{font-size:0.75rem;color:#666;margin-top:1rem;padding-top:0.75rem;border-top:1px solid #222}
.empty{color:#555;font-size:0.9rem;text-align:center;padding:3rem}
</style>
</head>
<body>
<h1>Tyree's Travel Hub</h1>
<p class="sub">All my travel itineraries in one place</p>
<div class="grid">
<a class="card" href="canada-usa-2026.html">
<h2>🇨🇦🇺🇸 加拿大·美国 15天自驾</h2>
<p>极光 · 落基山脉 · 优胜美地 · 旧金山<br>温哥华 → 白马 → 班夫 → 贾斯珀 → 优胜美地 → 旧金山</p>
<div class="dates">2026.09.27 – 10.11</div>
</a>
</div>
<p style="margin-top:3rem;font-size:0.75rem;color:#444">更多旅行攻略即将更新 ✦</p>
</body>
</html>
